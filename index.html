<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3ef">
  <title>UJHS Festival</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=Noto+Serif+KR:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 상단바 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="logo"><img src="images/logo.png" alt="" onerror="this.remove()"><b>UJHS Festival</b></a>
      <span id="mode-label" class="mode-label"></span>
      <nav id="topnav" class="topnav"></nav>
      <time id="clock" class="clock" aria-live="off"></time>
      <a id="login-link" class="login-link" href="#/op/login">LOGIN</a>
    </div>
  </header>

  <!-- 줄서기 호출 알림 띠 (내 번호가 호출되면 나타남) -->
  <div id="callbar" class="callbar" role="alert" aria-live="assertive"></div>

  <!-- 화면이 그려지는 곳 (app.js가 채움) -->
  <main id="app"></main>

  <!-- 하단 탭바 (모드에 따라 메뉴가 바뀜) -->
  <nav id="tabbar" class="tabbar"></nav>

  <!-- 알림 메시지 -->
  <div id="toast"></div>

  <!-- Firebase (서버 모드에서 사용) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <!-- 순서 중요: 데이터 → 저장소 → 화면 -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
